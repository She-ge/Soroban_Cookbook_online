[package]
name = "balance-snapshot"
version = "0.1.0"
edition = "2021"
description = "Soroban example ERC-20-style token that records point-in-time balance snapshots for historical lookups."
keywords = ["soroban", "example", "balance-snapshot"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "27.0.3", features = ["testutils"] }

[dev-dependencies]
soroban-sdk = { version = "27.0.3", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
