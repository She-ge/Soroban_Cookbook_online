[package]
name = "flash-loan"
version = "0.1.0"
edition = "2021"
description = "Soroban example flash-loan contract that lends liquidity with a fee and enforces repayment."
keywords = ["soroban", "example", "flash-loan"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "27.0.3", features = ["testutils"] }

[dev-dependencies]
soroban-sdk = { version = "27.0.3", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
